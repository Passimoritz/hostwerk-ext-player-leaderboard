<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/ext-sdk.js"></script>
  <style>
    .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 14px 0; }
    .entry { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--hw-line); }
    .entry.top { font-size: 16px; }
    .place { width: 34px; text-align: center; font-weight: 700; color: var(--muted); }
    .value { font-variant-numeric: tabular-nums; font-weight: 650; }
  </style>
</head>
<body>
  <p class="muted" id="sub"></p>
  <div class="tools">
    <select class="select" id="server" data-i18n-title="pick_server" title="Server"></select>
    <div class="row" id="metrics">
      <button class="btn sm primary" data-m="playMs" data-i18n="metric.playMs"></button>
      <button class="btn sm" data-m="sessions" data-i18n="metric.sessions"></button>
      <button class="btn sm" data-m="mined" data-i18n="metric.mined"></button>
      <button class="btn sm" data-m="deaths" data-i18n="metric.deaths"></button>
    </div>
  </div>
  <div class="card card-pad" id="list"><div class="hw-skeleton" style="height:120px"></div></div>
  <script src="lib.js"></script>
  <script src="app.js"></script>
</body>
</html>
